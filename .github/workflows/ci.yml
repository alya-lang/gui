name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux X11 headers (X11 fallback backend)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alya installation
        run: |
          alya --version

      - name: Check code formatting
        run: |
          alya fmt . --check

      - name: Run static analysis (linter)
        run: |
          alya lint . --check

      - name: Check package manifest
        run: |
          alya pkg list

      - name: Install dependencies
        run: |
          alya install

      - name: Run package test suite
        run: |
          alya test

      - name: Verify GUI bundle build + binary size gate
        shell: bash
        run: |
          alya build examples/hello_gui.alya --gui -o "$RUNNER_TEMP/hello_gui_check"
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="$RUNNER_TEMP/hello_gui_check.app/Contents/MacOS/hello_gui_check"
            SIZE=$(stat -f%z "$BIN")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$RUNNER_TEMP/hello_gui_check/hello_gui_check.exe"
            SIZE=$(stat -c%s "$BIN")
            grep -q "PerMonitorV2" "$RUNNER_TEMP/hello_gui_check/hello_gui_check.exe.manifest"
          else
            BIN="$RUNNER_TEMP/hello_gui_check/hello_gui_check"
            SIZE=$(stat -c%s "$BIN")
          fi
          echo "bundle binary bytes: $SIZE"
          test "$SIZE" -lt 5242880

      - name: Run micro-benchmarks smoke test
        if: hashFiles('benches/bench_basic.alya') != ''
        run: |
          alya run benches/bench_basic.alya

      - name: Build documentation
        shell: bash
        run: |
          alya doc . -o docs --markdown
          if [ -f docs/index.md ]; then
            echo "### 📖 API Documentation Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full HTML and Markdown documentation has been generated and archived in the **[api-docs]** artifact." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' docs/index.md | grep -v "Official API reference" | grep -v "^# " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: api-docs
          path: docs/
